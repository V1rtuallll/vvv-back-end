# 测试专用配置。
#
# 为什么需要这个文件：真实配置 src/main/resources/application.yml 含密钥，被 .gitignore 忽略，
# 所以 CI 的检出里根本没有它 —— 没有它 Spring 上下文起不来，所有 @SpringBootTest 全部报
# Failed to load ApplicationContext。放在 src/test/resources 下，测试类路径优先，
# 本地与 CI 都用这一份，测试因此不再依赖开发者本机的配置。
#
# 这里的值都是占位符，不会连接任何真实服务：HikariCP 连接池是惰性的，
# 上下文加载过程不会真的建立连接，所以 CI 不需要 MySQL。
# 有测试真的碰库时才会失败，那时应该给它单独准备数据源。
server:
  port: 0

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:1/vvv_test
    username: test
    password: test
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 20000MB
      max-request-size: 500000MB

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  type-aliases-package: com.v1rtual.vvv_backend.entity
  configuration:
    map-underscore-to-camel-case: true

aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: test-access-key-id
    access-key-secret: test-access-key-secret
    bucket-name: test-bucket

jwt:
  # HS384 要求密钥不少于 48 字节，这里给足长度
  secret: test-only-jwt-secret-not-for-production-0123456789abcdefghijklmn
  expiration: 604800000
